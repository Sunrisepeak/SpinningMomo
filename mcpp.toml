[package]
name      = "SpinningMomo"
version   = "2.1.4"
standard  = "c++23"
platforms = ["windows"]
license   = "GPL-3.0"

# llvm targeting the MSVC ABI — mcpp's own default on Windows, and the same
# toolchain the xmake build has always used (`clang-cl[llvm]`).
#
# It is NOT native cl.exe, and that is a decision with evidence rather than a
# preference. `import asio;` does not compile under cl.exe 19.51:
#
#   asio/io_context.hpp(1041): error C2039: 'service': is not a member of
#   'asio::io_context'   — while instantiating service_base<strand_service>
#
# asio declares `class service;` inside `io_context`, defines it at namespace
# scope, and derives a class template from it; a consumer instantiating any
# service has to find that nested class through the BMI, and cl.exe cannot.
# probes/p6-asio-module runs under BOTH toolchains and reports exactly this:
# green on llvm, red on msvc.
#
# The module form of asio is not optional here — it is what stops asio's
# template specializations from being re-instantiated per importing TU (C1116).
# So the toolchain follows from it.
#
# CONSEQUENCE: this driver is `clang++`, not `clang-cl`. Flags are GNU-spelled
# (`-luser32`, `-Wl,/subsystem:windows`), which is also why the official index's
# Windows descriptors spell their link libs `-lpsapi` and friends.
[toolchain]
windows = "llvm@22.1.8"

# The project's own path index (see mcpp/index.toml). The index NAME must equal
# the descriptors' `package.namespace`: the `[dependencies.sm]` table below is
# read as both the namespace table and the index selector.
#
# This table is TEMPORARY. It holds exactly the packages the official index does
# not carry yet; each one is being upstreamed to mcpplibs/mcpp-index, and the
# table disappears together with the `mcpp/` directory once they land. Anything
# the official index already has is consumed from there — see below.
[indices]
sm = { path = "mcpp" }


# The official index already carries these, so the project does not own them.
# It could not use them before 2026.8.16, because a dependency package compiled
# with its own flags (i.e. /MD) and this project must link /MT — see the
# `cxx_runtime` note in [build].
#
# libuv is not listed: sm.usockets depends on it and mcpp resolves it
# transitively. sqlite3 likewise arrives through sm.sqlitecpp.
[dependencies.compat]
spdlog = { version = "1.17.0", features = ["compiled"] }

# Still project-owned. Two kinds live here:
#
#   * packages the official index has no descriptor for at all;
#   * `asio`, which it DOES have — as a module, which is exactly the form this
#     project needs — but whose published export surface predates
#     mcpplibs/mcpp-index#213. That amendment is merged; this entry disappears
#     when the published artifact catches up. `scripts/check-asio-override.sh`
#     answers "is it time yet" in seconds, on Linux, without a CI round.
#
# Asio is consumed as a MODULE (`import asio;`), never as headers. That is what
# keeps its template specializations — `service_registry::use_service` and
# friends — instantiated ONCE inside the asio module rather than once per
# importing TU's global module fragment. The header form is what made
# `sm.core.rpc.*` die with C1116 when those modules were first converted.
#
# uwebsockets pulls usockets, which pulls compat.libuv; sqlitecpp pulls
# compat.sqlite3.
[dependencies.sm]
asio        = "1.38.1"
xxhash      = "0.8.3"
wil         = "1.0.260126.7"
sqlitecpp   = "3.3.3"
reflectcpp  = "0.25.0"
uwebsockets = "20.79.0"
libwebp     = "1.5.0"

[build]
# The MSVC CRT model, for the WHOLE build — this project's TUs, the cached `std`
# module object, AND every dependency package's TUs. `self-contained` is /MT on
# the MSVC ABI, which is what the xmake build spelled `set_runtimes("MT")`.
#
# This key was INERT on the MSVC ABI until mcpp 2026.8.16 (it reported "not
# implemented for the MSVC runtime yet" and fell back to /MD). That is the whole
# reason this project used to own a descriptor for every dependency: a consumer
# could not reach a dependency's compile line, so /MT had to be written into
# each descriptor by hand. It is honoured now, so the descriptors carry no CRT
# flags any more and the official index's packages became usable.
#
# Requires mcpp >= 2026.8.16 (.xlings.json pins 2026.8.17.1).
cxx_runtime = "self-contained"

# Modules and their implementation units both live under src/. The migration
# converts bottom-up: a leaf header becomes `<name>.cppm`, its consumers'
# `#include "…hpp"` become `import …;`. `.hpp` files that have not been
# converted yet keep working unchanged — a module and a header can coexist in
# the same build, which is what makes an incremental migration possible at all.
sources = ["src/**/*.cpp", "src/**/*.cppm"]

include_dirs = [
  "src",
  "third_party/dkm/include",
  # Both produced by scripts/mcpp-prebuild.sh. They must be project-relative
  # and space-free: mcpp emits include_dirs unquoted, so a path under
  # "C:/Program Files (x86)/..." reaches cl.exe as three arguments.
  "gen/cppwinrt",          # C++/WinRT projection (not in mcpp's synthesised INCLUDE)
  "gen/webview2/include",  # WebView2 SDK headers, unpacked from the NuGet package
]

defines = [
  "NOMINMAX", "UNICODE", "_UNICODE", "WIN32_LEAN_AND_MEAN", "_WIN32_WINNT=0x0A00",
  "yyjson_api_inline=yyjson_inline",
  # spdlog compiled mode: consumers must see this too, or their headers
  # re-emit the implementation inline instead of using the extern templates.
  "SPDLOG_COMPILED_LIB",
  # Asio's package contract. An index descriptor's `features.<f>.defines` reach
  # the PACKAGE's own TUs; a consumer that must agree with how the library was
  # built declares them itself. These five are exactly what
  # `chriskohlhoff.asio`'s default `separate-compilation` feature compiles with,
  # and disagreeing on ASIO_SEPARATE_COMPILATION alone is enough to make the
  # consumer re-emit inline what the package already compiled out-of-line.
  "ASIO_STANDALONE", "ASIO_SEPARATE_COMPILATION",
  "ASIO_DISABLE_BOOST_CONTEXT_FIBER", "ASIO_HAS_THREADS", "ASIO_NO_IOSTREAM",
  # uSockets' backend/SSL shape changes struct layouts in libusockets.h, so
  # every TU that sees a uWS header must agree with how the library was built.
  "LIBUS_USE_LIBUV", "LIBUS_NO_SSL", "UWS_NO_ZLIB",
]

# GNU-spelled, because the driver is `clang++` (see [toolchain]). `-l<name>`
# becomes `<name>.lib` on the lld-link line, and `-Wl,<x>` hands `<x>` to
# lld-link untouched — which is how an MSVC-style linker switch still gets
# through.
#
# This is also why `compat.libuv` writing `-lpsapi` now simply works: dependency
# ldflags are propagated VERBATIM (only `-L` and `-Wl,-rpath` are rewritten), so
# under cl.exe they used to arrive as an unrecognised option and be dropped with
# LNK4044.
ldflags = [
  "-Wl,/subsystem:windows",

  # The linker runs with cwd = target/<triple>/<hash>/ and ldflags entries are
  # passed verbatim, so file inputs have to climb back out to the project root.
  # (`mcpp:link-search=` resolves relative paths against the project root;
  # plain ldflags does not.)
  "-Wl,../../../gen/app.res",
  "-Wl,../../../gen/webview2/lib/WebView2LoaderStatic.lib",

  # Windows system libraries — the same set xmake linked.
  "-ldwmapi", "-ldcomp", "-lwindowsapp", "-lruntimeobject",
  "-ld3d11", "-ldxgi", "-ld3dcompiler", "-ld2d1", "-ldwrite",
  "-lshell32", "-lshlwapi", "-lgdi32", "-luser32", "-lws2_32",
  "-lsecur32", "-ladvapi32", "-lbcrypt", "-ldbghelp", "-luserenv",
  "-lmf", "-lmfplat", "-lmfreadwrite", "-lmfuuid", "-lstrmiids",
  "-lole32", "-loleaut32", "-lversion", "-lpropsys",

  # libuv's own Windows link set, minus what is already above.
  "-lpsapi", "-liphlpapi",
]

[profile.release]
# Release keeps full debug info so production crash dumps stay analysable, and
# forces the dynamic UCRT the way the xmake build did.
ldflags = ["-Wl,/debug:full", "-Wl,/nodefaultlib:libucrt.lib", "-Wl,/defaultlib:ucrt.lib"]

[targets.SpinningMomo]
kind = "bin"
main = "src/main.cpp"

# The hand-written `/MT` that used to live here is gone: `[build] cxx_runtime`
# now derives it once, for the project AND its dependencies. Two spellings of
# one physical switch is how the CRT drifted apart in the first place.
#
# -mbig-obj is clang's spelling of what the xmake build wrote `/bigobj`, and it
# is not optional: reflect-cpp instantiates enough templates per RPC endpoint to
# blow past COFF's 65,536-section limit.
#
# -Wno-microsoft-include: the xmake build already carried this for clang-cl. The
# Windows SDK and the C++/WinRT projection both resolve some includes the way
# MSVC does rather than the way the standard says, and clang reports each one.
[target.'cfg(windows)'.build]
cxxflags = ["-mbig-obj", "-Wno-microsoft-include"]
