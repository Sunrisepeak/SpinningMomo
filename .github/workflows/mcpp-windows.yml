name: mcpp-windows

# Windows-only CI for the mcpp migration.
#
# Local development happens on Linux, where mcpp's MSVC toolchain is hard-gated
# off (`msvc is only available on Windows hosts`). So EVERY MSVC fact has to be
# established here. The probe matrix exists to answer independent questions in
# one round-trip instead of serialising them across pushes: each entry is a
# self-contained mcpp project under `probes/`, and `fail-fast: false` keeps a
# failing probe from hiding the others' answers.

on:
  # push only. A PR's checks are resolved by head SHA, so the push run shows up
  # on the PR anyway; adding a `pull_request` trigger would just double every
  # matrix (14 cold bootstraps instead of 7) without adding a single fact.
  push:
    branches: ['mcpp/**']
  workflow_dispatch:

concurrency:
  group: mcpp-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned via .xlings.json + bare `xlings install` (passing a package name
  # makes xlings resolve "newest in this runner's index copy" and silently
  # ignore the workspace pin — mcpp's own CI learned this the hard way).
  XLINGS_VERSION: '2026.8.17.2'
  XLINGS_NON_INTERACTIVE: '1'

jobs:
  probe:
    name: ${{ matrix.probe }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        probe:
          - p0-hello           # mcpp installs, msvc detected, import std works
          - p1-win32gui        # WinMain + /SUBSYSTEM:WINDOWS + system libs
          - p2-rc              # build.mcpp drives rc.exe, .res reaches link.exe
          - p3a-win32-export   # module wrapping windows.h, re-export to ::
          - p3b-winrt-export   # module wrapping C++/WinRT (THE critical unknown)
          - p3c-gmf-direct     # consumer includes vendor headers in its own GMF
          - p4-importstd       # real project sources as modules + import std
          - p5-index           # the project's own package index, five descriptors
    steps:
      - uses: actions/checkout@v4

      - name: Cache xlings
        uses: actions/cache@v4
        with:
          path: ~/.xlings
          key: xlings-windows-xl${{ env.XLINGS_VERSION }}

      - name: Cache mcpp sandbox
        uses: actions/cache@v4
        with:
          path: ~/.mcpp
          # The index tree is part of the key: the sandbox remembers which
          # indices are registered, so a restored sandbox from before an index
          # rename keeps searching the old name and every package misses.
          # Exact key only — NO restore-keys. The sandbox remembers which
          # indices are registered and mcpp registers each one once, so a
          # prefix-restored sandbox from before an index rename keeps searching
          # the old name and every `sm:` package misses no matter how often the
          # build is retried.
          key: mcpp-sandbox-windows-xl${{ env.XLINGS_VERSION }}-${{ hashFiles('.xlings.json', 'mcpp/**') }}

      - name: Bootstrap xlings + mcpp
        shell: bash
        run: |
          set -euo pipefail
          REPO_DIR="$(pwd)"
          WORK=$(mktemp -d)
          zipfile="xlings-${XLINGS_VERSION}-windows-x86_64.zip"
          curl -fsSL -o "${WORK}/${zipfile}" \
            "https://github.com/d2learn/xlings/releases/download/v${XLINGS_VERSION}/${zipfile}"
          (cd "${WORK}" && unzip -q "${zipfile}")
          "$WORK/xlings-${XLINGS_VERSION}-windows-x86_64/subos/default/bin/xlings.exe" self install
          echo "$USERPROFILE/.xlings/subos/default/bin" >> "$GITHUB_PATH"
          XL="$USERPROFILE/.xlings/subos/default/bin/xlings.exe"
          "$XL" --version
          # No package NAME on the command line: with one, xlings resolves
          # "newest in this runner's index copy" and the .xlings.json workspace
          # pin never applies. `-u` activates what was just installed (a plain
          # install leaves the shim pointing at whatever was there before) and
          # `-g` makes it global. This is mcpp's own CI invocation verbatim.
          cd "$REPO_DIR"
          echo "::group::xlings install"
          "$XL" install -y -u -g
          echo "::endgroup::"
          MCPP="$USERPROFILE/.xlings/subos/default/bin/mcpp.exe"
          test -x "$MCPP" || MCPP=$(command -v mcpp || true)
          test -n "$MCPP" || { echo "FAIL: mcpp not on PATH after install"; exit 1; }
          echo "MCPP=$MCPP" >> "$GITHUB_ENV"
          "$MCPP" --version

      - name: Diagnose environment
        shell: bash
        continue-on-error: true
        run: |
          "$MCPP" self doctor || true
          "$MCPP" toolchain list || true

      - name: Select MSVC toolchain
        shell: bash
        run: |
          "$MCPP" toolchain default msvc

      - name: Pre-build step
        shell: bash
        working-directory: probes/${{ matrix.probe }}
        run: |
          set -euo pipefail
          if [ -f prebuild.sh ]; then
            bash prebuild.sh
          else
            echo "no prebuild.sh"
          fi

      - name: Register project index (junction)
        shell: bash
        run: |
          set -euo pipefail
          # mcpp registers a path index by symlinking it into the project
          # sandbox, and a directory symlink needs a privilege the runner
          # account does not have — see scripts/mcpp-link-index.sh.
          if [ -f "probes/${{ matrix.probe }}/mcpp.toml" ] \
             && grep -q '^\[indices\]' "probes/${{ matrix.probe }}/mcpp.toml"; then
            bash scripts/mcpp-link-index.sh "probes/${{ matrix.probe }}" sm mcpp
          else
            echo "probe declares no path index"
          fi

      - name: Build probe
        shell: bash
        working-directory: probes/${{ matrix.probe }}
        run: |
          set -uo pipefail
          # A path index declared in [indices] is registered with xlings on the
          # first invocation that reads the manifest, but the SAME invocation
          # has already snapshotted the repo list — so a cold project resolves
          # against [xim, mcpplibs] only and every `sm:` package misses. The
          # second invocation sees [sm, xim, mcpplibs]. Retry once, and let the
          # retry's exit code be the verdict.
          if ! "$MCPP" build -v 2>&1 | tail -200; then
            echo "--- first build failed; retrying once (index materialisation) ---"
            "$MCPP" build -v 2>&1 | tail -200
          fi

      - name: Run probe check
        shell: bash
        working-directory: probes/${{ matrix.probe }}
        run: |
          set -euo pipefail
          if [ -f check.sh ]; then
            bash check.sh
          else
            echo "no check.sh — build success is the whole assertion"
          fi

  # ── The real thing ────────────────────────────────────────────────────────
  # Builds SpinningMomo itself from the root mcpp.toml. Kept in the same
  # workflow so it shares the probe matrix's bootstrap and cache lineage, but
  # in its own job so a probe failure never masks it and vice versa.
  full-build:
    name: SpinningMomo (full)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Cache xlings
        uses: actions/cache@v4
        with:
          path: ~/.xlings
          key: xlings-windows-xl${{ env.XLINGS_VERSION }}

      - name: Cache mcpp sandbox
        uses: actions/cache@v4
        with:
          path: ~/.mcpp
          key: mcpp-sandbox-windows-full-xl${{ env.XLINGS_VERSION }}-${{ hashFiles('.xlings.json', 'mcpp/**') }}

      - name: Cache build outputs
        uses: actions/cache@v4
        with:
          path: target
          key: mcpp-target-windows-${{ hashFiles('src/**', 'mcpp.toml') }}
          restore-keys: mcpp-target-windows-

      - name: Bootstrap xlings + mcpp
        shell: bash
        run: |
          set -euo pipefail
          REPO_DIR="$(pwd)"
          WORK=$(mktemp -d)
          zipfile="xlings-${XLINGS_VERSION}-windows-x86_64.zip"
          curl -fsSL -o "${WORK}/${zipfile}" \
            "https://github.com/d2learn/xlings/releases/download/v${XLINGS_VERSION}/${zipfile}"
          (cd "${WORK}" && unzip -q "${zipfile}")
          "$WORK/xlings-${XLINGS_VERSION}-windows-x86_64/subos/default/bin/xlings.exe" self install
          echo "$USERPROFILE/.xlings/subos/default/bin" >> "$GITHUB_PATH"
          XL="$USERPROFILE/.xlings/subos/default/bin/xlings.exe"
          cd "$REPO_DIR"
          "$XL" install -y -u -g
          MCPP="$USERPROFILE/.xlings/subos/default/bin/mcpp.exe"
          test -n "$MCPP" && test -x "$MCPP"
          echo "MCPP=$MCPP" >> "$GITHUB_ENV"
          "$MCPP" --version

      - name: Select MSVC toolchain
        shell: bash
        run: |
          "$MCPP" toolchain default msvc

      - name: Fetch header-only third-party (dkm)
        shell: bash
        run: node scripts/fetch-third-party.js

      - name: Register project index (junction)
        shell: bash
        run: bash scripts/mcpp-link-index.sh . sm mcpp

      - name: Diagnose index registration
        shell: bash
        continue-on-error: true
        run: |
          echo "--- project .mcpp/.xlings.json ---"
          cat .mcpp/.xlings.json 2>/dev/null || echo "(absent)"
          echo "--- project .mcpp tree ---"
          find .mcpp -maxdepth 3 2>/dev/null | head -30 || true
          echo "--- global ~/.mcpp/config.toml ---"
          cat "$USERPROFILE/.mcpp/config.toml" 2>/dev/null || echo "(absent)"
          echo "--- mcpp index list ---"
          "$MCPP" index list || true

      - name: Pre-build (resources, cppwinrt, WebView2)
        shell: bash
        run: bash scripts/mcpp-prebuild.sh

      - name: Build
        shell: bash
        run: |
          set -uo pipefail
          "$MCPP" build -v 2>&1 | tail -400

      - name: Report artefact
        shell: bash
        run: |
          set -euo pipefail
          exe=$(find target -name 'SpinningMomo.exe' | head -1)
          test -n "$exe" || { echo "FAIL: no SpinningMomo.exe"; exit 1; }
          ls -la "$exe"
          powershell -NoProfile -Command \
            "(Get-Item '$(cygpath -w "$exe")').VersionInfo | Format-List ProductName,ProductVersion,FileVersion"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SpinningMomo-mcpp
          path: target/**/bin/SpinningMomo.exe
          if-no-files-found: error
