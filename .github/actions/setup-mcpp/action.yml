name: Setup mcpp
description: >
  Install xlings + mcpp at the version this repository pins, restore the package
  sandbox, and select the toolchain. Three workflows need exactly this, so it
  lives in one place — a copy that drifts is a build that behaves differently
  depending on which workflow started it.

inputs:
  xlings-version:
    description: xlings release to install.
    required: false
    default: '2026.8.17.2'

runs:
  using: composite
  steps:
    - name: Cache xlings
      uses: actions/cache@v4
      with:
        path: ~/.xlings
        key: xlings-windows-xl${{ inputs.xlings-version }}

    - name: Cache mcpp sandbox
      uses: actions/cache@v4
      with:
        path: ~/.mcpp
        # Exact key, NO restore-keys. The sandbox remembers which indices are
        # registered and mcpp registers each one once, so a prefix-restored
        # sandbox from before an index change keeps searching the old name and
        # every package misses no matter how often the build is retried.
        # Shared by every workflow on purpose: what lands in the sandbox is
        # decided by .xlings.json + mcpp.toml, and both are in the key. Giving
        # each workflow its own suffix would just mean three cold dependency
        # builds where one will do.
        key: >-
          mcpp-sandbox-windows-xl${{ inputs.xlings-version }}-${{
          hashFiles('.xlings.json', 'mcpp.toml') }}

    - name: Bootstrap xlings + mcpp
      shell: bash
      env:
        XLINGS_VERSION: ${{ inputs.xlings-version }}
        XLINGS_NON_INTERACTIVE: '1'
      run: |
        set -euo pipefail
        REPO_DIR="$(pwd)"
        WORK=$(mktemp -d)
        zipfile="xlings-${XLINGS_VERSION}-windows-x86_64.zip"
        curl -fsSL -o "${WORK}/${zipfile}" \
          "https://github.com/d2learn/xlings/releases/download/v${XLINGS_VERSION}/${zipfile}"
        (cd "${WORK}" && unzip -q "${zipfile}")
        "$WORK/xlings-${XLINGS_VERSION}-windows-x86_64/subos/default/bin/xlings.exe" self install
        echo "$USERPROFILE/.xlings/subos/default/bin" >> "$GITHUB_PATH"
        XL="$USERPROFILE/.xlings/subos/default/bin/xlings.exe"
        # No package NAME on the command line: with one, xlings resolves "newest
        # in this runner's index copy" and the .xlings.json workspace pin never
        # applies. `-u` activates what was just installed (a plain install
        # leaves the shim pointing at whatever was there before), `-g` makes it
        # global. This is mcpp's own CI invocation verbatim.
        cd "$REPO_DIR"
        echo "::group::xlings install"
        "$XL" install -y -u -g
        echo "::endgroup::"
        MCPP="$USERPROFILE/.xlings/subos/default/bin/mcpp.exe"
        test -x "$MCPP" || MCPP=$(command -v mcpp || true)
        test -n "$MCPP" || { echo "FAIL: mcpp not on PATH after install"; exit 1; }
        echo "MCPP=$MCPP" >> "$GITHUB_ENV"
        "$MCPP" --version

    - name: Select toolchain
      shell: bash
      run: |
        set -euo pipefail
        # mcpp.toml pins the version, so this only makes sure the payload is
        # present before the build starts — and puts what was resolved in the log.
        "$MCPP" toolchain install llvm
        "$MCPP" toolchain default llvm
        "$MCPP" toolchain list
