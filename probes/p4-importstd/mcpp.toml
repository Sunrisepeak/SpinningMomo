[package]
name      = "p4importstd"
version   = "0.1.0"
standard  = "c++23"
platforms = ["windows"]

[toolchain]
windows = "msvc@system"

[build]
# The CRT, in ONE place. Hand-writing `/MT` into cxxflags used to work by
# accident: mcpp passed no CRT flag when building the cached `std` module, so cl
# defaulted it to /MT and the two happened to agree. Since 2026.8.16 mcpp DERIVES
# the flag — from `linkage` / `cxx_runtime` — for the project's TUs and the std
# module alike, so a manifest that says nothing gets /MD for std while its own
# cxxflags still force /MT, and the link dies on `__imp__fwrite_nolock` with
# LNK4098 'MSVCRT conflicts with use of other libs'.
#
# Say it once, the way mcpp asks (mcpp#422).
cxx_runtime = "self-contained"
include_dirs = ["src"]
