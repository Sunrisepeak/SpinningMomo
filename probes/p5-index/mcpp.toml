[package]
name      = "p5index"
version   = "0.1.0"
standard  = "c++23"
platforms = ["windows"]

# NO [toolchain] pin. mcpp's own default on Windows is llvm targeting the MSVC
# ABI, and that is what this project now uses — see the root mcpp.toml. Leaving
# the pin out lets the CI matrix run a probe under either toolchain, which is
# how the asio/MSVC difference was found in the first place.

# The project's own path index — everything the official mcpp-index does not
# carry lives here, which keeps the migration off cross-repo coordination.
#
# The index NAME must equal the descriptors' `package.namespace`. The dependency
# sub-table below is read as both the namespace table and the index selector, so
# an index called `spinningmomo` holding `sm`-namespaced packages is
# unreachable: that spelling expands to `(spinningmomo, sm.reflectcpp)` and
# every candidate misses.
[indices]
sm = { path = "../../mcpp" }

# Explicit-table form: a single candidate `(sm, <name>)`, no guessing. Bare
# names would not reach a third-party namespace at all (SPEC-001 §4.2).
# `sqlite3` is deliberately NOT listed: sm.sqlitecpp depends on the official
# index's `compat.sqlite3`, so this probe also asserts that a path-index package
# can pull a package from the published remote index — the shape every
# descriptor here takes once it is upstreamed.
[dependencies.sm]
xxhash     = "0.8.3"
wil        = "1.0.260126.7"
sqlitecpp  = "3.3.3"
reflectcpp = "0.25.0"

[build]
# The CRT, derived once for this project AND its dependency packages. This is
# what replaced the hand-written /MT in every descriptor; the probe fails at
# link time with LNK2038 if it ever stops reaching the packages.
cxx_runtime = "self-contained"
defines = ["NOMINMAX", "UNICODE", "_UNICODE", "WIN32_LEAN_AND_MEAN", "_WIN32_WINNT=0x0A00"]
ldflags = ["-lole32", "-loleaut32"]
