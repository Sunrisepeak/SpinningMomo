[package]
name      = "p5index"
version   = "0.1.0"
standard  = "c++23"
platforms = ["windows"]

[toolchain]
windows = "msvc@system"

# The project's own path index. Everything the official mcpp-index does not
# carry is described here; a path index keeps the migration off cross-repo
# coordination entirely.
[indices]
spinningmomo = { path = "../../mcpp" }

[dependencies.spinningmomo]
"sm.xxhash"     = "0.8.3"
"sm.wil"        = "1.0.260126.7"
"sm.sqlite3"    = "3.50.4"
"sm.sqlitecpp"  = "3.3.3"
"sm.reflectcpp" = "0.25.0"

[build]
defines = ["NOMINMAX", "UNICODE", "_UNICODE", "WIN32_LEAN_AND_MEAN", "_WIN32_WINNT=0x0A00"]
ldflags = ["ole32.lib", "oleaut32.lib"]
