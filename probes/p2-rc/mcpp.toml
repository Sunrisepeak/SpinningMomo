[package]
name      = "p2rc"
version   = "0.1.0"
standard  = "c++23"
platforms = ["windows"]

[toolchain]
windows = "msvc@system"

[build]
# The CRT, in ONE place. Hand-writing `/MT` into cxxflags used to work by
# accident: mcpp passed no CRT flag when building the cached `std` module, so cl
# defaulted it to /MT and the two happened to agree. Since 2026.8.16 mcpp DERIVES
# the flag — from `linkage` / `cxx_runtime` — for the project's TUs and the std
# module alike, so a manifest that says nothing gets /MD for std while its own
# cxxflags still force /MT, and the link dies on `__imp__fwrite_nolock` with
# LNK4098 'MSVCRT conflicts with use of other libs'.
#
# Say it once, the way mcpp asks (mcpp#422).
cxx_runtime = "self-contained"
defines = ["NOMINMAX", "UNICODE", "_UNICODE", "WIN32_LEAN_AND_MEAN"]
# build.mcpp compiles app.rc to this fixed path; link.exe takes a .res as a
# plain input object. It CANNOT come through build.mcpp's own directive
# channel: `mcpp:link-lib=` is hard-wired to emit `-l<name>`
# (build_program.cppm:132), which the MSVC dialect does not understand.
# So the path is a static ldflags entry and build.mcpp only has to produce it.
# link.exe runs with cwd = target/<triple>/<hash>/ and ldflags entries are
# passed verbatim (LNK1181 on a package-relative path), so the .res has to be
# reached by climbing back out. `mcpp:link-search=` resolves relative paths
# against the project root; plain ldflags does not — worth an upstream issue.
ldflags = ["/SUBSYSTEM:WINDOWS", "user32.lib", "../../../gen/app.res"]
